name: storyworld-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storyworld
      POSTGRES_PASSWORD: storyworld-dev-only
      POSTGRES_DB: storyworld
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyworld"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storyworld
      MINIO_ROOT_PASSWORD: storyworld-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: storyworld
      POSTGRES_PWD: storyworld-dev-only
      POSTGRES_SEEDS: postgres
    ports:
      - "7235:7233"  # 7233 is Commerce Foundry's local Temporal; Storyworld gets its own

volumes:
  pgdata:
  miniodata:
