name: validate

# Independent trust boundary for the harness and dossier contracts:
# runs the read-only structural check and the mutation test suite on the
# exact pushed tree. Read-only by design — refresh (the derived-file writer)
# is never run in CI; a stale manifest is a failure to fix locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read-only structural check
        run: python -B .agent/scripts/validate.py --check
      - name: Harness unit and mutation tests
        run: python -B -m unittest discover -s .agent/tests -p "test_*.py"
      - name: Contract-pack validation
        run: python -B packages/contracts/tests/validate_contracts.py

  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storyworld
          POSTGRES_PASSWORD: storyworld-dev-only
          POSTGRES_DB: storyworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storyworld"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://storyworld:storyworld-dev-only@localhost:5432/storyworld
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: storyworld
      S3_SECRET_KEY: storyworld-dev-only
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable
      - name: Start MinIO (official image needs a command; services cannot pass one)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=storyworld -e MINIO_ROOT_PASSWORD=storyworld-dev-only \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - name: Start Temporal (host network so auto-setup reaches the postgres service)
        run: |
          docker run -d --name temporal --network host \
            -e DB=postgres12 -e DB_PORT=5432 \
            -e POSTGRES_USER=storyworld -e POSTGRES_PWD=storyworld-dev-only \
            -e POSTGRES_SEEDS=localhost \
            temporalio/auto-setup:latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Wait for Temporal (default namespace registered)
        run: |
          for i in $(seq 1 90); do
            if docker exec temporal temporal operator namespace describe default >/dev/null 2>&1 \
              || docker exec temporal tctl --address localhost:7233 namespace describe default >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "temporal did not become ready" >&2
          docker logs temporal 2>&1 | tail -50
          exit 1
      - name: Tests
        run: pnpm -r test
      - name: Lint
        run: pnpm -r lint
      - name: Compose profile validates
        run: docker compose -f infra/compose.yaml config -q
      - name: Restore drill (DEC-0010 rider)
        run: |
          PG_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16" | head -1)
          test -n "$PG_CONTAINER"
          PG_CONTAINER="$PG_CONTAINER" bash infra/scripts/restore-drill.sh
