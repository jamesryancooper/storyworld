name: validate

# Independent trust boundary for the harness and dossier contracts:
# runs the read-only structural check and the mutation test suite on the
# exact pushed tree. Read-only by design — refresh (the derived-file writer)
# is never run in CI; a stale manifest is a failure to fix locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read-only structural check
        run: python -B .agent/scripts/validate.py --check
      - name: Harness unit and mutation tests
        run: python -B -m unittest discover -s .agent/tests -p "test_*.py"
      - name: Contract-pack validation
        run: python -B packages/contracts/tests/validate_contracts.py

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests
        run: pnpm -r test
      - name: Lint
        run: pnpm -r lint
      - name: Compose profile validates
        run: docker compose -f infra/compose.yaml config -q
